<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- No zooming and no bounce: a pinch or a double tap on the stick should
         steer, not resize the page. viewport-fit lets the controls sit inside
         a notched phone's safe area rather than under the notch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Lighttown Madness League</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <!--
      The physics engine is a megabyte of WebAssembly, so there is a real wait
      before anything can be drawn. Saying so beats a blank page. Removed by
      main.ts once the game is up.
    -->
    <div id="boot">
      <div class="boot-title">Lighttown Madness League</div>
      <div class="boot-note">Loading physics…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
